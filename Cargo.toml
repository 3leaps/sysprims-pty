[package]
name = "sysprims-pty"
version = "0.9.1"
authors = ["Wez Furlong", "3 Leaps, LLC"]
edition = "2018"
rust-version = "1.88.0"
repository = "https://github.com/3leaps/sysprims-pty"
homepage = "https://github.com/3leaps/sysprims-pty"
description = "Cross-platform PTY interface with sysprims containment"
documentation = "https://docs.rs/sysprims-pty"
readme = "README.md"
license = "MIT"
keywords = ["pty", "terminal", "conpty", "process", "containment"]
categories = ["command-line-interface", "development-tools", "os"]
include = [
    "Cargo.toml",
    "Cargo.lock",
    "VERSION",
    "README.md",
    "UPSTREAM.md",
    "LICENSE-MIT",
    "CHANGELOG.md",
    "RELEASE_NOTES.md",
    "docs/releases/v0.9.1.md",
    "src/**/*.rs",
    "tests/**/*.rs",
    "examples/**/*.rs",
]
publish = true
resolver = "2"

[lib]
name = "portable_pty"
path = "src/lib.rs"

[features]
default = []
serde_support = ["serde", "serde_derive"]

[dependencies]
anyhow = "1.0"
downcast-rs = "1.0"
filedescriptor = "0.8.3"
log = "0.4"
libc = "0.2"
nix = { version = "0.28", features = ["term", "fs"] }
shell-words = "1.1"
serde_derive = { version = "1.0", optional = true }
serde = { version = "1.0", optional = true }
serial2 = "0.2"
sysprims-timeout = "=0.2.3"

[target."cfg(windows)".dependencies]
bitflags = "1.3"
lazy_static = "1.4"
shared_library = "0.1"
winapi = { version = "0.3", features = [
    "winuser",
    "consoleapi",
    "handleapi",
    "fileapi",
    "namedpipeapi",
    "synchapi",
]}
winreg = "0.10"

[target."cfg(unix)".dependencies.sysprims-session]
version = "=0.2.3"

[dev-dependencies]
smol = "2.0"
futures = "0.3"
